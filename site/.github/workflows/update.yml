name: Update MP holdings

on:
  schedule:
    - cron: "17 8 * * *"      # every day at 08:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed so the job can commit the new CSV

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/scrape_mp_holdings.py --out mp_holdings.csv
      - run: python scripts/add_party.py mp_holdings.csv
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add mp_holdings.csv
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%F)" && git push)
